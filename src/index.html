<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8">
  <title>EdifIQ · Rastreamento</title>
  <base href="/">

  <!--
    user-scalable=no + maximum-scale=1: desabilita zoom de pinça
    (comportamento padrão de app nativo no celular).
    viewport-fit=cover: conteúdo vai até o notch/island — as classes
    safe-area-inset-* no HTML compensam o recorte.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- PWA / status bar -->
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Rastreamento de entregas de materiais de construção em tempo real">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EdifIQ">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">

  <!--
    Evita flash branco no carregamento — o fundo já é zinc-950
    antes mesmo do Angular hidratizar
  -->
  <style>html,body{background:#09090b;margin:0;padding:0}</style>
</head>
<body>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar este aplicativo.</noscript>
</body>
</html>
